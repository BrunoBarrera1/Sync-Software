<!-- ===== SYNCSNAKE CHATBOT - COMPONENTE ===== -->

<!-- Botón flotante del chatbot -->
<button id="chatbotToggle" class="chatbot-button" aria-label="Abrir chat con SyncSnake">
    <img src="Sync-Snake.svg" alt="SyncSnake Logo" class="snake-logo">
    <span id="notificationBadge" class="notification-badge">1</span>
</button>

<!-- Ventana del chatbot -->
<div id="chatbotWindow" class="chatbot-window">
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-header-info">
            <div id="snakeAvatar" class="snake-avatar">
                <img src="Sync-Snake.svg" alt="SyncSnake">
            </div>
            <div>
                <h3 class="chat-title">SyncSnake</h3>
                <p id="statusText" class="chat-status">En línea</p>
            </div>
        </div>
        <button id="closeChat" class="close-button" aria-label="Cerrar chat">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Área de mensajes -->
    <div id="chatMessages" class="chat-messages">
        <!-- Los mensajes se agregan dinámicamente con JavaScript -->
    </div>

    <!-- Respuestas rápidas -->
    <div id="quickReplies" class="quick-replies">
        <button class="quick-reply" data-message="¿Cuáles son sus planes y precios?">💰 Precios</button>
        <button class="quick-reply" data-message="¿Qué tecnologías utilizan?">⚡ Tecnologías</button>
        <button class="quick-reply" data-message="¿Cuánto tarda el desarrollo?">⏱️ Tiempos</button>
        <button class="quick-reply" data-message="Quiero solicitar una cotización">📧 Cotizar</button>
    </div>

    <!-- Input de mensaje -->
    <div class="chat-input-wrapper">
        <textarea 
            id="chatInput" 
            class="chat-input" 
            placeholder="Escribe tu mensaje..."
            rows="1"
            maxlength="500"
        ></textarea>
        <button id="sendButton" class="send-button" aria-label="Enviar mensaje">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
        </button>
    </div>
</div>
