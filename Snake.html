<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncSnake - Asistente Virtual</title>
    <style>
/* ===== VARIABLES (mismo CSS de tu landing) ===== */
:root {
    --primary: #0047AB;
    --primary-light: #0057D9;
    --accent: #00A3FF;
    --bg: #050505;
    --bg-2: #0F0F0F;
    --bg-3: #1A1A1A;
    --text: #FFFFFF;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --border: rgba(255, 255, 255, 0.1);
    --glow: rgba(0, 71, 171, 0.5);
    --success: #10B981;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', Monaco, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-2);
    line-height: 1.6;
    overflow: hidden;
}

/* ===== CHATBOT BUTTON FLOTANTE ===== */
.chatbot-button {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 50%;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 30px var(--glow);
    transition: all 0.3s;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-button:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 40px var(--glow);
}

.chatbot-button.active {
    transform: scale(0.9);
}

.chatbot-button svg {
    width: 40px;
    height: 40px;
    fill: white;
}

/* Pulse animation */
.chatbot-button::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--primary);
    opacity: 0.5;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0; }
    100% { transform: scale(1); opacity: 0; }
}

/* Badge de notificación */
.notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 24px;
    height: 24px;
    background: #EF4444;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: white;
    border: 2px solid var(--bg);
}

/* ===== CHATBOT WINDOW ===== */
.chatbot-window {
    position: fixed;
    bottom: 110px;
    right: 24px;
    width: 400px;
    height: 600px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    display: none;
    flex-direction: column;
    z-index: 999;
    overflow: hidden;
    backdrop-filter: blur(20px);
}

.chatbot-window.active {
    display: flex;
    animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ===== HEADER DEL CHAT ===== */
.chat-header {
    padding: 20px 24px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
}

.snake-avatar {
    width: 50px;
    height: 50px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.snake-avatar svg {
    width: 32px;
    height: 32px;
}

.snake-avatar.thinking {
    animation: bounce 0.6s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.chat-info {
    flex: 1;
}

.chat-name {
    font-size: 18px;
    font-weight: 700;
    color: white;
    margin-bottom: 2px;
}

.chat-status {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: var(--success);
    border-radius: 50%;
    animation: blink 2s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

.close-chat {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: background 0.3s;
}

.close-chat:hover {
    background: rgba(255, 255, 255, 0.1);
}

.close-chat svg {
    width: 24px;
    height: 24px;
    stroke: white;
}

/* ===== MESSAGES AREA ===== */
.chat-messages {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.chat-messages::-webkit-scrollbar {
    width: 6px;
}

.chat-messages::-webkit-scrollbar-track {
    background: var(--bg);
}

.chat-messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
}

.message {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    flex-direction: row-reverse;
}

.message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.message.bot .message-avatar {
    background: linear-gradient(135deg, var(--primary), var(--accent));
}

.message.bot .message-avatar svg {
    width: 20px;
    height: 20px;
    fill: white;
}

.message.user .message-avatar {
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
}

.message-content {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
}

.message.bot .message-content {
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: var(--text-2);
    border-bottom-left-radius: 4px;
}

.message.user .message-content {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    border-bottom-right-radius: 4px;
}

.message-time {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 4px;
}

/* Typing indicator */
.typing-indicator {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
}

.typing-dot {
    width: 8px;
    height: 8px;
    background: var(--text-3);
    border-radius: 50%;
    animation: typing 1.4s infinite;
}

.typing-dot:nth-child(2) {
    animation-delay: 0.2s;
}

.typing-dot:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-10px); }
}

/* ===== QUICK REPLIES ===== */
.quick-replies {
    padding: 0 24px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.quick-reply {
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.3s;
}

.quick-reply:hover {
    background: rgba(0, 71, 171, 0.2);
    border-color: var(--primary);
    color: var(--text);
}

/* ===== INPUT AREA ===== */
.chat-input-container {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--bg);
}

.chat-input-wrapper {
    display: flex;
    gap: 12px;
    align-items: flex-end;
}

.chat-input {
    flex: 1;
    padding: 12px 16px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    resize: none;
    max-height: 100px;
    transition: all 0.3s;
}

.chat-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 71, 171, 0.1);
}

.chat-input::placeholder {
    color: var(--text-3);
}

.send-button {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
}

.send-button:hover {
    box-shadow: 0 0 20px var(--glow);
    transform: translateY(-2px);
}

.send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.send-button svg {
    width: 20px;
    height: 20px;
    stroke: white;
    fill: none;
}

/* ===== WELCOME MESSAGE ===== */
.welcome-message {
    text-align: center;
    padding: 40px 24px;
}

.welcome-snake {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.welcome-snake svg {
    width: 50px;
    height: 50px;
    fill: white;
}

.welcome-message h3 {
    font-size: 20px;
    color: var(--text);
    margin-bottom: 8px;
}

.welcome-message p {
    font-size: 14px;
    color: var(--text-3);
    margin-bottom: 24px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .chatbot-window {
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }
    
    .chatbot-button {
        bottom: 16px;
        right: 16px;
    }
}

/* ===== ERROR STATE ===== */
.error-message {
    padding: 12px 16px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 12px;
    color: #EF4444;
    font-size: 13px;
    text-align: center;
    margin: 0 24px;
}
    </style>
</head>
<body>
    <!-- Botón flotante del chatbot -->
    <button class="chatbot-button" id="chatbotToggle">
        <!-- Serpiente SVG -->
        <svg viewBox="0 0 64 64">
            <path d="M32 8 Q28 12, 24 16 Q20 20, 20 26 Q20 32, 24 36 Q28 40, 32 44 Q36 40, 40 36 Q44 32, 44 26 Q44 20, 40 16 Q36 12, 32 8 M32 20 Q34 22, 34 24 Q34 26, 32 28 Q30 26, 30 24 Q30 22, 32 20"/>
            <circle cx="28" cy="22" r="2"/>
            <circle cx="36" cy="22" r="2"/>
        </svg>
        <span class="notification-badge" id="notificationBadge" style="display: none;">1</span>
    </button>

    <!-- Ventana del chatbot -->
    <div class="chatbot-window" id="chatbotWindow">
        <!-- Header -->
        <div class="chat-header">
            <div class="snake-avatar" id="snakeAvatar">
                <svg viewBox="0 0 64 64">
                    <path fill="#0047AB" d="M32 8 Q28 12, 24 16 Q20 20, 20 26 Q20 32, 24 36 Q28 40, 32 44 Q36 40, 40 36 Q44 32, 44 26 Q44 20, 40 16 Q36 12, 32 8 M32 20 Q34 22, 34 24 Q34 26, 32 28 Q30 26, 30 24 Q30 22, 32 20"/>
                    <circle cx="28" cy="22" r="2" fill="white"/>
                    <circle cx="36" cy="22" r="2" fill="white"/>
                </svg>
            </div>
            <div class="chat-info">
                <div class="chat-name">SyncSnake</div>
                <div class="chat-status">
                    <span class="status-dot"></span>
                    <span id="statusText">En línea</span>
                </div>
            </div>
            <button class="close-chat" id="closeChat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <div class="welcome-snake">
                    <svg viewBox="0 0 64 64">
                        <path d="M32 8 Q28 12, 24 16 Q20 20, 20 26 Q20 32, 24 36 Q28 40, 32 44 Q36 40, 40 36 Q44 32, 44 26 Q44 20, 40 16 Q36 12, 32 8 M32 20 Q34 22, 34 24 Q34 26, 32 28 Q30 26, 30 24 Q30 22, 32 20"/>
                        <circle cx="28" cy="22" r="2"/>
                        <circle cx="36" cy="22" r="2"/>
                    </svg>
                </div>
                <h3>¡Hola! Soy SyncSnake 🐍</h3>
                <p>Tu asistente virtual de Sync Software.<br>¿En qué puedo ayudarte hoy?</p>
            </div>
        </div>

        <!-- Quick Replies -->
        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply" data-message="¿Cuánto cuesta un sitio web?">💰 Precios</button>
            <button class="quick-reply" data-message="¿Cuánto tiempo toma un proyecto?">⏱️ Tiempos</button>
            <button class="quick-reply" data-message="¿Qué tecnologías usan?">💻 Tecnologías</button>
            <button class="quick-reply" data-message="Quiero solicitar una propuesta">📋 Propuesta</button>
        </div>

        <!-- Input Area -->
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="Escribe tu pregunta..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
// ===== CONFIGURACIÓN =====
const CONFIG = {
    // 🔒 IMPORTANTE: Reemplaza con tu API key de Google AI Studio
    // NUNCA compartas esta key públicamente
    API_KEY: 'TU_API_KEY_AQUI',
    API_URL: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent',
    
    // Contexto del chatbot
    SYSTEM_CONTEXT: `Eres SyncSnake, el asistente virtual amigable de Sync Software, una empresa de desarrollo web premium en Uruguay. 

Información sobre Sync Software:
- Somos un equipo de 2 desarrolladores: Geronimo (Frontend/UI-UX) y Bruno (Backend/Holberton).
- Ofrecemos 3 planes principales:
  * Starter ($500): Landing pages responsivas con SEO básico
  * Professional ($1,200): Sitios corporativos con CMS y hasta 10 páginas
  * Enterprise ($2,500+): Aplicaciones web con FastAPI + React + PostgreSQL
- Nuestro stack: Python, FastAPI, React, PostgreSQL, Tailwind
- Tiempos de entrega: 7-10 días (landing), 14-21 días (corporativo), 30-45 días (app web)
- Incluimos: código 100% del cliente, hosting + SSL 1 año, 30 días soporte
- Ubicados en Montevideo, Uruguay
- Respuesta garantizada en <24 horas

Personalidad:
- Sé amigable, profesional pero cercano
- Usa emojis ocasionalmente 🐍
- Respuestas concisas (máx 3 párrafos)
- Si no sabes algo, recomienda contactar directamente

IMPORTANTE: Nunca inventes precios o features que no mencioné. Si preguntan algo que no sabes, di que pueden contactar directamente.`
};

// ===== ELEMENTOS DOM =====
const elements = {
    toggle: document.getElementById('chatbotToggle'),
    window: document.getElementById('chatbotWindow'),
    close: document.getElementById('closeChat'),
    messages: document.getElementById('chatMessages'),
    input: document.getElementById('chatInput'),
    sendBtn: document.getElementById('sendButton'),
    quickReplies: document.getElementById('quickReplies'),
    avatar: document.getElementById('snakeAvatar'),
    statusText: document.getElementById('statusText'),
    badge: document.getElementById('notificationBadge')
};

// ===== ESTADO =====
let conversationHistory = [];
let isTyping = false;

// ===== FUNCIONES PRINCIPALES =====

// Toggle chatbot
function toggleChatbot() {
    const isActive = elements.window.classList.toggle('active');
    elements.toggle.classList.toggle('active');
    
    if (isActive) {
        elements.input.focus();
        elements.badge.style.display = 'none';
        
        // Mensaje de bienvenida si es la primera vez
        if (conversationHistory.length === 0) {
            setTimeout(() => {
                addBotMessage("¡Hola! 👋 Soy SyncSnake, tu asistente virtual. Puedo ayudarte con información sobre nuestros servicios, precios, tecnologías y más. ¿Qué te gustaría saber?");
            }, 500);
        }
    }
}

// Agregar mensaje del usuario
function addUserMessage(text) {
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message user';
    messageDiv.innerHTML = `
        <div class="message-avatar">U</div>
        <div>
            <div class="message-content">${escapeHtml(text)}</div>
            <div class="message-time">${getCurrentTime()}</div>
        </div>
    `;
    elements.messages.appendChild(messageDiv);
    scrollToBottom();
}

// Agregar mensaje del bot
function addBotMessage(text) {
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message bot';
    messageDiv.innerHTML = `
        <div class="message-avatar">
            <svg viewBox="0 0 64 64">
                <path d="M32 8 Q28 12, 24 16 Q20 20, 20 26 Q20 32, 24 36 Q28 40, 32 44 Q36 40, 40 36 Q44 32, 44 26 Q44 20, 40 16 Q36 12, 32 8 M32 20 Q34 22, 34 24 Q34 26, 32 28 Q30 26, 30 24 Q30 22, 32 20"/>
                <circle cx="28" cy="22" r="2"/>
                <circle cx="36" cy="22" r="2"/>
            </svg>
        </div>
        <div>
            <div class="message-content">${formatBotMessage(text)}</div>
            <div class="message-time">${getCurrentTime()}</div>
        </div>
    `;
    elements.messages.appendChild(messageDiv);
    scrollToBottom();
}

// Mostrar indicador de escritura
function showTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `
        <div class="message-avatar">
            <svg viewBox="0 0 64 64">
                <path d="M32 8 Q28 12, 24 16 Q20 20, 20 26 Q20 32, 24 36 Q28 40, 32 44 Q36 40, 40 36 Q44 32, 44 26 Q44 20, 40 16 Q36 12, 32 8 M32 20 Q34 22, 34 24 Q34 26, 32 28 Q30 26, 30 24 Q30 22, 32 20"/>
                <circle cx="28" cy="22" r="2"/>
                <circle cx="36" cy="22" r="2"/>
            </svg>
        </div>
        <div class="message-content typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    `;
    elements.messages.appendChild(typingDiv);
    elements.avatar.classList.add('thinking');
    elements.statusText.textContent = 'Escribiendo...';
    scrollToBottom();
}

// Ocultar indicador de escritura
function hideTypingIndicator() {
    const typingIndicator = document.getElementById('typingIndicator');
    if (typingIndicator) {
        typingIndicator.remove();
    }
    elements.avatar.classList.remove('thinking');
    elements.statusText.textContent = 'En línea';
}

// Enviar mensaje a Google AI
async function sendToAI(userMessage) {
    // Verificar API key
    if (CONFIG.API_KEY === 'TU_API_KEY_AQUI') {
        hideTypingIndicator();
        showError('⚠️ Por favor configura tu API key de Google AI Studio en el código.');
        return;
    }

    try {
        showTypingIndicator();
        
        // Construir el prompt con contexto
        const prompt = `${CONFIG.SYSTEM_CONTEXT}\n\nUsuario: ${userMessage}\nSyncSnake:`;
        
        const response = await fetch(`${CONFIG.API_URL}?key=${CONFIG.API_KEY}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: prompt
                    }]
                }],
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 500,
                }
            })
        });

        if (!response.ok) {
            throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        hideTypingIndicator();
        
        if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
            const botResponse = data.candidates[0].content.parts[0].text;
            addBotMessage(botResponse);
            
            // Guardar en historial
            conversationHistory.push({
                user: userMessage,
                bot: botResponse,
                timestamp: new Date()
            });
        } else {
            throw new Error('Respuesta inválida de la API');
        }
        
    } catch (error) {
        console.error('Error al comunicar con AI:', error);
        hideTypingIndicator();
        showError('😔 Ups, tuve un problema. Por favor intenta de nuevo o contacta directamente.');
    }
}

// Mostrar error
function showError(message) {
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error-message';
    errorDiv.textContent = message;
    elements.messages.appendChild(errorDiv);
    scrollToBottom();
    
    setTimeout(() => {
        errorDiv.remove();
    }, 5000);
}

// Enviar mensaje
async function sendMessage() {
    const text = elements.input.value.trim();
    
    if (!text || isTyping) return;
    
    addUserMessage(text);
    elements.input.value = '';
    elements.input.style.height = 'auto';
    
    isTyping = true;
    elements.sendBtn.disabled = true;
    
    await sendToAI(text);
    
    isTyping = false;
    elements.sendBtn.disabled = false;
    elements.input.focus();
}

// Auto-resize textarea
function autoResizeTextarea() {
    elements.input.style.height = 'auto';
    elements.input.style.height = elements.input.scrollHeight + 'px';
}

// Scroll al final
function scrollToBottom() {
    elements.messages.scrollTop = elements.messages.scrollHeight;
}

// Formato de mensajes del bot
function formatBotMessage(text) {
    // Convertir URLs a links
    text = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: var(--primary);">$1</a>');
    
    // Convertir saltos de línea
    text = text.replace(/\n/g, '<br>');
    
    return text;
}

// Escape HTML
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Obtener hora actual
function getCurrentTime() {
    const now = new Date();
    return now.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
}

// ===== EVENT LISTENERS =====

elements.toggle.addEventListener('click', toggleChatbot);
elements.close.addEventListener('click', toggleChatbot);

elements.sendBtn.addEventListener('click', sendMessage);

elements.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

elements.input.addEventListener('input', autoResizeTextarea);

// Quick replies
elements.quickReplies.addEventListener('click', (e) => {
    if (e.target.classList.contains('quick-reply')) {
        const message = e.target.dataset.message;
        elements.input.value = message;
        sendMessage();
    }
});

// Mostrar badge después de 3 segundos si no ha abierto el chat
setTimeout(() => {
    if (!elements.window.classList.contains('active')) {
        elements.badge.style.display = 'flex';
    }
}, 3000);

console.log('🐍 SyncSnake iniciado');
